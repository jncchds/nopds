# PostgreSQL for local development: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nopds
      POSTGRES_USER: nopds
      POSTGRES_PASSWORD: nopds
    ports:
      - "5432:5432"
    volumes:
      - nopds-dev-db:/var/lib/postgresql/data
volumes:
  nopds-dev-db:
